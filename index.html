<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><meta name="description" content="随时来一局，指尖滑动的2048小游戏。"><title>2048 · 指尖数字</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#343b31;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:460px;margin:auto;padding: max(26px,env(safe-area-inset-top)) 22px 26px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;letter-spacing:3px;font-weight:750;color:#7a8473}.tag{font-size:11px;border:1px solid #d8ddcf;border-radius:20px;padding:7px 10px;color:#717d64}h1{font-size:78px;line-height:1;margin:25px 0 8px;letter-spacing:-6px;font-weight:850}.intro{color:#858a7c;font-size:14px;margin:0 0 26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.stat{border:1px solid #dedfd4;border-radius:16px;padding:13px 18px;background:#faf8f1}.label{font-size:11px;color:#8a8f80;letter-spacing:1px}.number{font-size:28px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}.best{color:#7c8a55}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:#929887}.actions{display:flex;gap:8px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:3px solid #99a66d;outline-offset:3px}.small{border-radius:9px;padding:10px 13px;background:#e7e9dd;color:#65724e;font-weight:600}.small:disabled{opacity:.4}.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:10px;border-radius:20px;background:#d9ddcd;touch-action:none;user-select:none;outline:none}.cell{aspect-ratio:1;border-radius:12px;background:#e8ebdf;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,38px);font-weight:780;color:#69705b;transition:background .12s,transform .12s}.cell[data-v="2"]{background:#fcfaf1}.cell[data-v="4"]{background:#eff0ce}.cell[data-v="8"]{background:#cbd99b;color:#52613a}.cell[data-v="16"]{background:#a9c67c;color:#fff}.cell[data-v="32"]{background:#7fa561;color:white}.cell[data-v="64"]{background:#568562;color:white}.cell[data-v="128"]{background:#e4bd6f;color:white}.cell[data-v="256"]{background:#dca45c;color:white}.cell[data-v="512"]{background:#d58b54;color:white}.cell[data-v="1024"]{background:#bd7552;color:white;font-size:29px}.cell[data-v="2048"]{background:#ddbd55;color:white;font-size:29px}.cell.high{background:#445d47;color:#fff;font-size:25px}.pop{animation:pop .18s ease-out}@keyframes pop{50%{transform:scale(.86)}}.hint{text-align:center;color:#8c9382;font-size:12px;margin:18px 0 22px}.how{border-top:1px solid #dfe2d5;padding-top:18px;display:flex;gap:14px;align-items:start}.icon{background:#e7eadb;border-radius:12px;padding:12px;font-size:19px}.how b{font-size:13px}.how p{font-size:12px;line-height:1.8;color:#939986;margin:6px 0}.footer{text-align:center;font-size:10px;color:#a0a594;letter-spacing:2px;margin-top:22px}.overlay{position:absolute;inset:0;background:#f6f2e9ed;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;text-align:center;padding:20px}.overlay h2{font-size:28px;margin:0 0 8px}.overlay p{color:#7c856e;font-size:14px}.primary{background:#657c4d;color:#fff;padding:14px 24px;border-radius:12px;margin-top:12px;font-weight:650}.overlay[hidden]{display:none}.live{min-height:18px;text-align:center;font-size:12px;color:#79865e;margin-top:10px}@media(max-height:740px){h1{font-size:60px;margin-top:18px}.intro{margin-bottom:18px}.hint{margin:12px 0}.footer{margin-top:12px}main{padding-top:20px}}
</style></head><body><main><header class="top"><span class="brand">POCKET PLAY / 01</span><span class="tag">一局，放松一下</span></header><h1>2048<span style="color:#8e9c6d">.</span></h1><p class="intro">从 2 开始，让每一次相遇都有意义。</p><section class="stats"><div class="stat"><div class="label">当前分数</div><div class="number" id="score">0</div></div><div class="stat"><div class="label">个人最佳 ↗</div><div class="number best" id="best">0</div></div></section><div class="bar"><span>小数字，大可能</span><div class="actions"><button class="small" id="undo" disabled>↶ 撤销</button><button class="small" id="restart">新一局</button></div></div><div class="board" id="board" tabindex="0" aria-label="2048游戏棋盘，用手指滑动或方向键操作"><div class="overlay" id="overlay" hidden><h2 id="title"></h2><p id="message"></p><button class="primary" id="again">再来一局</button><button class="small" id="continue" style="margin-top:10px" hidden>继续挑战</button></div></div><div class="live" id="live" aria-live="polite"></div><div class="hint">↑ ↓ ← → &nbsp; 滑动屏幕 · 合并相同数字</div><section class="how"><span class="icon">✧</span><div><b>慢慢来，也能到 2048</b><p>相同数字相遇，就会合成双倍数字。<br>试着把最大数字留在角落，给新数字留点空间。</p></div></section><footer class="footer">无需下载 · 随时来一局</footer></main><script>const board=document.querySelector('#board'), overlay=document.querySelector('#overlay');
const cells=Array.from({length:16},()=>{const c=document.createElement('div');c.className='cell';board.insertBefore(c,overlay);return c});
let grid=Array(16).fill(0),score=0,best=0,previous=null,won=false,locked=false;
try{best=Number(localStorage.getItem('pocket2048best'))||0}catch{}
function combine(line){let a=line.filter(Boolean),out=[],gain=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);gain+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return {line:out,gain}}
function spawn(){const empty=grid.map((v,i)=>v? -1:i).filter(i=>i>=0);if(empty.length)grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4}
function render(animate=false){cells.forEach((c,i)=>{c.textContent=grid[i]||'';c.dataset.v=grid[i];c.className='cell'+(grid[i]>2048?' high':'');if(animate&&grid[i]){void c.offsetWidth;c.classList.add('pop')}});document.querySelector('#score').textContent=score;document.querySelector('#best').textContent=best;document.querySelector('#undo').disabled=!previous}
function available(){return grid.some((v,i)=>!v||(i%4<3&&v===grid[i+1])||(i<12&&v===grid[i+4]))}
function show(title,message,victory=false){locked=true;overlay.hidden=false;document.querySelector('#title').textContent=title;document.querySelector('#message').textContent=message;document.querySelector('#continue').hidden=!victory}
function move(direction){if(locked)return;const old={grid:[...grid],score,won};let next=[...grid],gain=0;for(let a=0;a<4;a++){const ids=Array.from({length:4},(_,b)=>direction==='left'?a*4+b:direction==='right'?a*4+3-b:direction==='up'?b*4+a:(3-b)*4+a);const result=combine(ids.map(i=>grid[i]));gain+=result.gain;ids.forEach((id,i)=>next[id]=result.line[i])}if(next.every((v,i)=>v===grid[i]))return;previous=old;grid=next;score+=gain;if(score>best){best=score;try{localStorage.setItem('pocket2048best',best)}catch{}}spawn();render(true);document.querySelector('#live').textContent=gain?'合并成功 +'+gain:'继续加油，留一点空间';if(!won&&grid.some(v=>v>=2048)){won=true;show('合成 2048！','每一次小小的相遇，终于成为了大成就。',true)}else if(!available())show('这局很精彩','最终得分 '+score+' · 再试一次，突破自己！')}
function reset(){grid=Array(16).fill(0);score=0;previous=null;won=false;locked=false;overlay.hidden=true;spawn();spawn();render();document.querySelector('#live').textContent='准备好了吗？滑动开始吧'}
document.querySelector('#undo').onclick=()=>{if(!previous)return;grid=previous.grid;score=previous.score;won=previous.won;previous=null;locked=false;overlay.hidden=true;render();document.querySelector('#live').textContent='已撤销一步'};
document.querySelector('#restart').onclick=()=>{if(score||previous){show('开启新的一局？','本局进度将清空，最高纪录会保留。');document.querySelector('#again').textContent='确认重新开始';document.querySelector('#continue').hidden=false;document.querySelector('#continue').textContent='返回本局'}else reset()};
document.querySelector('#again').onclick=()=>{document.querySelector('#again').textContent='再来一局';document.querySelector('#continue').textContent='继续挑战';reset()};document.querySelector('#continue').onclick=()=>{locked=false;overlay.hidden=true;document.querySelector('#again').textContent='再来一局';document.querySelector('#continue').textContent='继续挑战'};
let start=null;board.addEventListener('pointerdown',e=>{if(e.target.closest('button')||locked)return;start={x:e.clientX,y:e.clientY,id:e.pointerId};board.setPointerCapture(e.pointerId)});board.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});board.addEventListener('pointercancel',()=>start=null);document.addEventListener('keydown',e=>{const dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(dirs[e.key]){e.preventDefault();move(dirs[e.key])}});reset();
</script></body></html>
