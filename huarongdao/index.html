<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>予一人 · 华容道</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#354632;font-family:system-ui,-apple-system,sans-serif}main{max-width:440px;margin:auto;padding:24px 22px 30px}header{display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:3px;font-weight:650}.seal{display:grid;place-items:center;width:40px;height:40px;border:1px solid #87976e;border-radius:13px 13px 13px 4px;background:#e8ecdd;font:27px KaiTi,serif}.small{font-size:11px;color:#8b947e;letter-spacing:1px}h1{font-size:43px;margin:25px 0 6px;letter-spacing:5px}.intro{font-size:13px;color:#859079;margin:0 0 20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.count{font-size:14px}.count b{font-size:25px;margin-right:6px;font-variant-numeric:tabular-nums}button{border:0;border-radius:11px;padding:11px 15px;background:#e5e9da;color:#546b45;font:600 13px system-ui;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #c5a460;outline-offset:2px}.tools{display:flex;gap:7px}.frame{position:relative;padding:10px;background:#d5dcc8;border-radius:17px}.board{position:relative;width:100%;aspect-ratio:4/5;touch-action:none}.piece{position:absolute;left:calc(var(--x)*25% + 3px);top:calc(var(--y)*20% + 3px);width:calc(var(--w)*25% - 6px);height:calc(var(--h)*20% - 6px);border-radius:11px;background:#91a779;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;font-family:KaiTi,STKaiti,serif;font-size:24px;font-weight:600;box-shadow:inset 0 -4px 0 #0000000d;transition:left .15s,top .15s,box-shadow .15s;user-select:none}.piece.vertical span{writing-mode:vertical-rl;letter-spacing:10px;padding-top:10px}.piece.king{background:#c89c64;font-size:35px;letter-spacing:8px;text-indent:8px}.piece.guard{background:#628260;letter-spacing:8px;text-indent:8px}.piece.pawn{background:#b5be99;color:#4e6141;font-size:25px}.piece.selected{outline:3px solid #fff9df;outline-offset:-5px;box-shadow:0 0 0 3px #73824d,inset 0 -4px 0 #0000000d;z-index:1}.exit{width:50%;margin:0 auto;text-align:center;border-top:5px solid #c89c64;color:#ac8755;padding-top:8px;font-size:11px;letter-spacing:5px}.status{min-height:40px;text-align:center;font-size:13px;line-height:1.6;color:#7b886d;margin:13px 0 6px}.controls{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,46px);gap:7px;justify-content:center}.controls button{font-size:22px;padding:0}.up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}.guide{font-size:12px;color:#8c957f;line-height:1.9;margin:20px 0 0;padding-top:15px;border-top:1px solid #dce1d2}.guide b{color:#657754}.dialog{position:fixed;inset:0;background:#27302175;display:grid;place-items:center;padding:24px;z-index:5}.dialog[hidden]{display:none}.card{width:100%;max-width:340px;border-radius:22px;background:#faf8ef;padding:30px;text-align:center}.card h2{margin:0 0 12px;font-size:27px}.card p{color:#859079;font-size:14px;line-height:1.8}.primary{background:#657f50;color:white}.card .tools{justify-content:center;margin-top:20px}footer{text-align:center;font-size:10px;letter-spacing:2px;color:#a0a791;margin-top:20px}@media(prefers-reduced-motion:reduce){.piece{transition:none}}@media(max-height:750px){main{max-width:360px;padding-top:16px}h1{font-size:34px;margin-top:16px}.intro{margin-bottom:12px}.status{margin-top:8px}.guide{margin-top:12px}.controls{grid-template-rows:repeat(2,40px)}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}.levels button{font-size:12px;padding:10px 3px;border:1px solid transparent}.levels button[aria-pressed="true"]{background:#657f50;color:white;border-color:#657f50}.level-note{font-size:11px;color:#929b84;margin:0 0 14px}</style></head><body><main><header><div class="logo"><span class="seal">予</span><span>予一人</span></div><span class="small">留一点时间给自己</span></header><h1>华容道<span style="color:#b49b70">.</span></h1><p class="intro">三关挑战 · 方寸之间，寻一条出路</p><nav class="levels" aria-label="选择关卡"><button data-level="0">第1关 · 初试</button><button data-level="1">第2关 · 巧解</button><button data-level="2">第3关 · 横刀</button></nav><p class="level-note" id="levelNote"></p><div class="bar"><div class="count"><b id="steps">0</b>步</div><div class="tools"><button id="undo" disabled>↶ 撤销</button><button id="restart">重新开始</button></div></div><div class="frame"><div class="board" id="board" aria-label="四列五行华容道棋盘"></div></div><div class="exit">↓ 曹操出口 ↓</div><p id="status" class="status" aria-live="polite">点选一枚棋子，再按方向移动</p><div class="controls" aria-label="移动选中的棋子"><button class="up" data-d="0,-1" aria-label="向上移动">↑</button><button class="left" data-d="-1,0" aria-label="向左移动">←</button><button class="down" data-d="0,1" aria-label="向下移动">↓</button><button class="right" data-d="1,0" aria-label="向右移动">→</button></div><p class="guide"><b>如何通关</b><br>移动棋子，不能重叠或旋转。将最大的「曹操」移到棋盘底部中央，即可逃出生天。<br>可点选后按方向，也可在棋子上滑动；电脑支持方向键。每移动一格计一步，撤销不限次数。</p><footer>予一人 · 慢慢想，总有出路</footer></main><div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="card"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="tools"><button id="cancel">继续思考</button><button class="primary" id="confirm">重新开始</button></div></div></div><script>
const levels=[{"name":"初试身手","description":"先熟悉移动，为曹操腾出出口。","pieces":[{"n":"曹操","x":0,"y":2,"w":2,"h":2,"c":"king"},{"n":"张飞","x":3,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"赵云","x":2,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"马超","x":1,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"黄忠","x":0,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"关羽","x":2,"y":3,"w":2,"h":1,"c":"guard"},{"n":"兵","x":2,"y":2,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":0,"y":4,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":2,"y":4,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":3,"y":2,"w":1,"h":1,"c":"pawn"}]},{"name":"巧解重围","description":"需要多次让位，试着提前安排空格。","pieces":[{"n":"曹操","x":2,"y":1,"w":2,"h":2,"c":"king"},{"n":"张飞","x":1,"y":1,"w":1,"h":2,"c":"vertical"},{"n":"赵云","x":1,"y":3,"w":1,"h":2,"c":"vertical"},{"n":"马超","x":0,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"黄忠","x":0,"y":2,"w":1,"h":2,"c":"vertical"},{"n":"关羽","x":2,"y":3,"w":2,"h":1,"c":"guard"},{"n":"兵","x":2,"y":0,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":2,"y":4,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":3,"y":4,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":3,"y":0,"w":1,"h":1,"c":"pawn"}]},{"name":"横刀立马","description":"经典横刀立马布局，耐心寻找突破。","pieces":[{"n":"曹操","x":1,"y":0,"w":2,"h":2,"c":"king"},{"n":"张飞","x":0,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"赵云","x":3,"y":0,"w":1,"h":2,"c":"vertical"},{"n":"马超","x":0,"y":2,"w":1,"h":2,"c":"vertical"},{"n":"黄忠","x":3,"y":2,"w":1,"h":2,"c":"vertical"},{"n":"关羽","x":1,"y":2,"w":2,"h":1,"c":"guard"},{"n":"兵","x":1,"y":3,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":2,"y":3,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":0,"y":4,"w":1,"h":1,"c":"pawn"},{"n":"兵","x":3,"y":4,"w":1,"h":1,"c":"pawn"}]}];
let level=0,pendingLevel=null;
const initial=levels[0].pieces;
let pieces=initial.map(p=>({...p})),selected=null,history=[],won=false,dialogMode='';const board=document.getElementById('board'),status=document.getElementById('status'),dialog=document.getElementById('dialog');
function canMove(list,id,dx,dy){const p=list[id],x=p.x+dx,y=p.y+dy;if(x<0||y<0||x+p.w>4||y+p.h>5)return false;return list.every((q,j)=>j===id||x+p.w<=q.x||x>=q.x+q.w||y+p.h<=q.y||y>=q.y+q.h)}
const buttons=pieces.map((p,i)=>{const b=document.createElement('button');b.className='piece '+p.c;b.innerHTML='<span>'+p.n+'</span>';b.setAttribute('aria-label',p.n+'，宽'+p.w+'格，高'+p.h+'格');b.onclick=()=>{if(won)return;selected=i;status.textContent='已选 '+p.n+' · 按亮起的方向键移动';render()};let start=null;b.addEventListener('pointerdown',e=>{if(won)return;selected=i;render();start={x:e.clientX,y:e.clientY};b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0)});b.addEventListener('pointercancel',()=>start=null);board.appendChild(b);return b});
function render(){document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===level)));document.getElementById('levelNote').textContent='第 '+(level+1)+' / 3 关 · '+levels[level].name+' — '+levels[level].description;pieces.forEach((p,i)=>{const b=buttons[i];for(const k of ['x','y','w','h'])b.style.setProperty('--'+k,p[k]);b.classList.toggle('selected',i===selected);b.setAttribute('aria-pressed',String(i===selected))});document.getElementById('steps').textContent=history.length;document.getElementById('undo').disabled=!history.length;document.querySelectorAll('[data-d]').forEach(b=>{const [dx,dy]=b.dataset.d.split(',').map(Number);b.disabled=selected===null||won||!dialog.hidden||!canMove(pieces,selected,dx,dy)})}
function show(mode){dialogMode=mode;dialog.hidden=false;const victory=mode==='win',switching=mode==='switch';document.getElementById('dialogTitle').textContent=victory?(level===2?'三关挑战完成！':'第 '+(level+1)+' 关通关！'):switching?'切换关卡？':'重新开始？';document.getElementById('dialogText').textContent=victory?'你用了 '+history.length+' 步，帮曹操找到了出路。'+(level<2?'准备好挑战下一关了吗？':'可以选关重玩，挑战更少步数。'):switching?'切换后，当前这一局的步数和进度会清空。':'本关进度将清空，从「'+levels[level].name+'」重新出发。';document.getElementById('cancel').textContent=victory?'看看棋盘':'继续思考';document.getElementById('confirm').textContent=victory?(level<2?'进入下一关':'从第一关再挑战'):switching?'确认切换':'确认重开';render();document.getElementById('confirm').focus()}
function loadLevel(next){level=next;pieces=levels[level].pieces.map(p=>({...p}));history=[];selected=null;won=false;pendingLevel=null;dialog.hidden=true;status.textContent='点选一枚棋子，再按方向移动';render()}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{const next=Number(b.dataset.level);if(next===level)return;if(history.length&&!won){pendingLevel=next;show('switch')}else loadLevel(next)});
function move(dx,dy){if(selected===null||won||!dialog.hidden)return;if(!canMove(pieces,selected,dx,dy)){status.textContent='这个方向被挡住了，换条路试试';return}history.push({pieces:pieces.map(p=>({...p})),selected});pieces[selected].x+=dx;pieces[selected].y+=dy;status.textContent='已移动 '+pieces[selected].n+' · 继续寻找出路';if(pieces[0].x===1&&pieces[0].y===3){won=true;status.textContent='曹操已到达出口，挑战成功！';show('win')}render()}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));
document.getElementById('undo').onclick=()=>{if(!history.length)return;const last=history.pop();pieces=last.pieces;selected=last.selected;won=false;dialog.hidden=true;status.textContent='已撤销一步';render()};document.getElementById('restart').onclick=()=>show('restart');document.getElementById('cancel').onclick=()=>{dialog.hidden=true;render();document.getElementById('restart').focus()};document.getElementById('confirm').onclick=()=>{loadLevel(dialogMode==='switch'?pendingLevel:dialogMode==='win'?(level+1)%levels.length:level);document.getElementById('restart').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden){document.getElementById('cancel').click();return}const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});render();
</script></body></html>
